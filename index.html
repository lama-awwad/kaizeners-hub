<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kaizeners Org Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
    input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 280px; font-size: 14px; }
    .chart-container { width: 100%; height: 85vh; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px auto; border: 2px solid #2563eb; }
    .name { font-weight: 700; color: #1e293b; font-size: 14px; }
    .role { font-size: 12px; color: #64748b; margin-top: 2px; }
    .dept { display: inline-block; font-size: 11px; color: #2563eb; background: #eff6ff; padding: 2px 8px; border-radius: 9999px; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search by name, role, or team..." oninput="handleSearch(this.value)" />
  </div>
  <div id="chart" class="chart-container"></div>

<script>
    const SUPABASE_URL = "https://uveakairpegqwbauihxz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2ZWFrYWlycGVncXdiYXVpaHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NjU5NDcsImV4cCI6MjEwOTQ0MTk0N30.haN9MaUsSydF6D8JYVtg-z0WesTfIdqI5dBDjKPT_YQ";
    // Renamed from 'supabase' to 'supabaseClient'
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let chart;

    async function initChart() {
      // Use supabaseClient here:
      const { data: employees, error } = await supabaseClient.from('employees').select('*');
      if (error) {
        console.error("Supabase query error:", error);
        return;
      }
      if (!employees || employees.length === 0) {
        console.warn("No employee records found in Supabase.");
        return;
      }

      const formatted = employees.map(emp => ({
        id: String(emp.id),
        parentId: emp.manager_id ? String(emp.manager_id) : null,
        name: emp.full_name,
        role: emp.job_title,
        department: emp.department,
        avatar: emp.avatar_url || 'https://via.placeholder.com/100'
      }));

      chart = new d3.OrgChart()
        .container('#chart')
        .data(formatted)
        .nodeHeight(d => 140)
        .nodeWidth(d => 210)
        .nodeContent(d => `
          <div class="card">
            <img class="avatar" src="${d.data.avatar}" onerror="this.src='https://via.placeholder.com/100'" />
            <div class="name">${d.data.name}</div>
            <div class="role">${d.data.role}</div>
            <div class="dept">${d.data.department}</div>
          </div>
        `)
        .render();
    }

    function handleSearch(query) {
      if (!chart) return;
      chart.clearHighlighting();
      if (query.trim() !== '') {
        chart.setUpToTheRootHighlighted(query).render();
      }
    }

    initChart();
  </script>
</body>
</html>
